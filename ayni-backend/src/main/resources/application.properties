spring.application.name=ayni-backend

server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ayni_ecommerce_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=ayni_user
spring.datasource.password=Ayni123456*
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=America/Lima
spring.jackson.locale=es_PE

app.jwt.secret=ayni_backend_super_secret_key_2026_for_local_development_only_123456789
app.jwt.expiration-ms=86400000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true

# ===============================
# MAIL - BREVO SMTP
# ===============================
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${AYNI_MAIL_USERNAME}
spring.mail.password=${AYNI_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${AYNI_MAIL_FROM}
app.mail.enabled=true