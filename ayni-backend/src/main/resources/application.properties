spring.application.name=ayni-backend

server.port=8080

# ===============================
# CONFIGURACIÓN DE BASE DE DATOS (POSTGRESQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/ayni_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CONFIGURACIÓN DE JACKSON (FECHAS Y LOCALIZACIÓN)
# ===============================
spring.jackson.time-zone=America/Lima
spring.jackson.locale=es_PE

# ===============================
# CONFIGURACIÓN DE SEGURIDAD (JWT)
# ===============================
app.jwt.secret=ayni_backend_super_secret_key_2026_for_local_development_only_123456789
app.jwt.expiration-ms=86400000

# ===============================
# CONFIGURACIÓN DE SWAGGER / OPENAPI
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true